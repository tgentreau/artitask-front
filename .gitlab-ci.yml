variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  CHROME_BIN: "/usr/bin/google-chrome"

sonarcloud-check:
  image: node:18.19-bullseye
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - node_modules
  before_script:
    - apt-get update
    - apt-get install -y chromium chromium-driver
    - sudo npm install -g sonar-scanner
    - export CHROME_BIN=/usr/bin/chromium
    - npm install
    - npm run test -- --no-watch --browsers ChromeHeadlessCI --code-coverage
  script:
    - sonar-scanner
      -Dsonar.projectKey=artitask-front
      -Dsonar.sources=src
      -Dsonar.tests=src
      -Dsonar.test.inclusions=**/*.spec.ts
      -Dsonar.typescript.lcov.reportPaths=coverage/artitask/lcov.info
      -Dsonar.javascript.lcov.reportPaths=coverage/artitask/lcov.info
  only:
    - merge_requests
    - main
    - develop
