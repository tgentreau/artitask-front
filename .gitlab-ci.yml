variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  CHROME_BIN: "/usr/bin/google-chrome"

stages:
  - test
  - sonar

test-coverage:
  stage: test
  image: mcr.microsoft.com/playwright:focal
  script:
    - npm install
    - npm run test -- --no-watch --browsers=ChromeHeadless --code-coverage
  artifacts:
    paths:
      - coverage/

sonarcloud-check:
  stage: sonar
  needs: ["test-coverage"]
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.projectKey=tgentreau_artitask-front
      -Dsonar.organization=tgentreau
      -Dsonar.sources=src
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.token=${SONAR_TOKEN}
  only:
    - merge_requests
    - main
    - develop