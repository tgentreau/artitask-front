variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

sonarcloud-check:
  image: cimg/node:18.17-browsers
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - node_modules
  before_script:
    - npm install
    - npm run test - --configuration=ci
  script:
    - sonar-scanner
      -Dsonar.projectKey=artitask-front
      -Dsonar.sources=src
      -Dsonar.tests=src
      -Dsonar.test.inclusions=**/*.spec.ts
      -Dsonar.typescript.lcov.reportPaths=coverage/artitask/lcov.info
      -Dsonar.javascript.lcov.reportPaths=coverage/artitask/lcov.info
  only:
    - merge_requests
    - main
    - develop
