# Informations du projet
sonar.projectKey=tgentreau_artitask-front
sonar.organization=tgentreau
sonar.projectName=ArtiTask Frontend
sonar.projectVersion=1.0

# Source et tests
sonar.sources=src/app
sonar.tests=src/app
sonar.exclusions=**/*.spec.ts,**/test.ts,**/polyfills.ts
sonar.test.inclusions=**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/artitask/lcov.info
sonar.typescript.lcov.reportPaths=coverage/artitask/lcov.info


# Encodage du code source
sonar.sourceEncoding=UTF-8

# Configuration additionnelle Angular
sonar.coverage.exclusions=**/*.module.ts,**/*.html,**/main.ts,**/environment*.ts,**/polyfills.ts

# Configuration qualité
sonar.typescript.tslint.reportPaths=tslint-report.json
