<div class="min-h-screen bg-gray-100">
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 justify-between">
        <div class="flex">
          <div class="flex flex-shrink-0 items-center">
            <h1 class="text-xl font-bold text-blue-600">Artisan Pro</h1>
          </div>
          <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
            <a routerLink="/dashboard" routerLinkActive="border-blue-500 text-gray-900"
               class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
              Dashboard
            </a>
            <a routerLink="/interventions" routerLinkActive="border-blue-500 text-gray-900"
               class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
              Interventions
            </a>
            <a routerLink="/clients" routerLinkActive="border-blue-500 text-gray-900"
               class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
              Clients
            </a>
          </div>
        </div>
        <div class="hidden sm:ml-6 sm:flex sm:items-center">
          <div class="relative ml-3">
            <button
              type="button"
              (click)="showUserMenu.set(!showUserMenu())"
              class="flex rounded-full bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            >
              <span class="sr-only">Menu utilisateur</span>
              <div class="h-8 w-8 rounded-full bg-blue-500 flex items-center justify-center">
                <span class="text-sm font-medium text-white">{{ getUserInitials() }}</span>
              </div>
            </button>
            @if (showUserMenu()) {
              <div class="absolute right-0 z-10 mt-2 w-48 origin-top-right rounded-md bg-white py-1 shadow-lg ring-1 ring-black ring-opacity-5">
                <div class="px-4 py-2 text-sm text-gray-700 border-b">
                  {{ authService.currentUser$()?.nomEntreprise }}
                </div>
                <button
                  (click)="logout()"
                  class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
                >
                  Se déconnecter
                </button>
              </div>
            }
          </div>
        </div>

        <div class="flex items-center sm:hidden">
          <button
            type="button"
            (click)="showMobileMenu.set(!showMobileMenu())"
            class="inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-gray-100 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500"
          >
            <span class="sr-only">Ouvrir le menu</span>
            @if (!showMobileMenu()) {
              <svg class="block h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
              </svg>
            } @else {
              <svg class="block h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            }
          </button>
        </div>
      </div>
    </div>

    @if (showMobileMenu()) {
      <div class="sm:hidden">
        <div class="space-y-1 pb-3 pt-2">
          <a routerLink="/dashboard" routerLinkActive="bg-blue-50 border-blue-500 text-blue-700"
             (click)="showMobileMenu.set(false)"
             class="border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
            Dashboard
          </a>
          <a routerLink="/interventions" routerLinkActive="bg-blue-50 border-blue-500 text-blue-700"
             (click)="showMobileMenu.set(false)"
             class="border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
            Interventions
          </a>
          <a routerLink="/clients" routerLinkActive="bg-blue-50 border-blue-500 text-blue-700"
             (click)="showMobileMenu.set(false)"
             class="border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
            Clients
          </a>
        </div>
        <div class="border-t border-gray-200 pb-3 pt-4">
          <div class="flex items-center px-4">
            <div class="flex-shrink-0">
              <div class="h-10 w-10 rounded-full bg-blue-500 flex items-center justify-center">
                <span class="text-sm font-medium text-white">{{ getUserInitials() }}</span>
              </div>
            </div>
            <div class="ml-3">
              <div class="text-base font-medium text-gray-800">{{ authService.currentUser$()?.nomEntreprise }}</div>
            </div>
          </div>
          <div class="mt-3 space-y-1">
            <button
              (click)="logout()"
              class="block w-full text-left px-4 py-2 text-base font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-800"
            >
              Se déconnecter
            </button>
          </div>
        </div>
      </div>
    }
  </nav>

  <main class="mx-auto max-w-7xl py-6 px-4 sm:px-6 lg:px-8">
    <router-outlet></router-outlet>
  </main>
</div>
